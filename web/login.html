<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:image/svg+xml;base64,PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0iVVRGLTgiPz48c3ZnIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyIgd2lkdGg9IjE2IiBoZWlnaHQ9IjE2Ij48cmVjdCB3aWR0aD0iMTYiIGhlaWdodD0iMTYiIGZpbGw9IiNmNzk0MWQiLz48dGV4dCB4PSIyIiB5PSIxNCIgZm9udC1zaXplPSIxMSIgZmlsbD0iI2ZmZiI+UjwvdGV4dD48L3N2Zz4K">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Relevamiento Taxis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.1/dist/pocketbase.umd.js" integrity="sha384-hY70gu8Te3sbIOcK/QdlA5ZS1N4wNtUY72G/FvV4hDP9GKsnyBnyo3xd7B12eV6t" crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="cargar.html">
        <span class="brand-mark">RT</span>
        <span>Relevamiento Taxis<span class="brand-sub">Gestión de asistencia</span></span>
      </a>
      <nav class="mainnav"></nav>
    </div>
  </header>

  <main>
    <div class="card" style="max-width:420px;margin:2rem auto">
      <h1 style="margin-top:0">Ingreso</h1>
      <p><small class="confdense">Datos confidenciales. Uso exclusivo para gestión de asistencia.</small></p>
      <p class="error" id="error" role="alert"></p>
      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="username">
        <p class="field-error" id="err_email" role="alert" hidden>Ingresá un email válido.</p>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
        <p class="field-error" id="err_password" role="alert" hidden>Ingresá la contraseña.</p>
        <p><button type="submit">Entrar</button></p>
      </form>
    </div>
  </main>
  <script src="js/masks.js"></script>
  <script>
    Auth.redirectIfAuth();

    // Validación UX on-blur + tilde (mismo sistema que cargar).
    function fieldState(inputId) {
      var el = document.getElementById(inputId), errP = document.getElementById("err_" + inputId);
      var ok = el.value.trim() !== "" && el.checkValidity();
      el.classList.toggle("is-invalid", !ok && el.value.trim() !== "");
      el.classList.toggle("is-valid", ok);
      el.setAttribute("aria-invalid", ok ? "false" : "true");
      if (errP) errP.hidden = ok || el.value.trim() === "";
    }
    ["email", "password"].forEach(function (id) {
      var el = document.getElementById(id);
      el.addEventListener("blur", function () { fieldState(id); });
      el.addEventListener("input", function () {
        if (el.value.trim() === "" || el.checkValidity()) fieldState(id);
      });
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("error");
      err.textContent = "";
      fieldState("email"); fieldState("password");
      if (!e.target.email.checkValidity() || !e.target.password.checkValidity()) {
        err.textContent = "Revise los campos marcados.";
        return;
      }
      try {
        await Auth.login(e.target.email.value.trim(), e.target.password.value);
        window.location.href = "cargar.html";
      } catch (_) {
        // Error genérico: no detallar qué campo falló (REQ-AUTH-2).
        err.textContent = "Credenciales inválidas.";
      }
    });
  </script>
</body>
</html>
